buildscript {
    repositories {
        //TODO! Del this
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
    }
}


apply plugin: 'scala'
apply plugin: 'maven'
apply plugin: 'info.gianlucacosta.aurora'


group = 'info.gianlucacosta.graphsj'
archivesBaseName = 'graphsj-sdk'
version = '7.0.0-SNAPSHOT'

description = 'GraphsJ - Scenario Development Kit (SDK)'


dependencies {
    compile 'org.scala-lang:scala-library:2.11.8'

    compile 'info.gianlucacosta.eighthbridge:eighthbridge:9.0.0-SNAPSHOT'
    compile 'info.gianlucacosta.lambdaprism:lambdaprism:4.0.0-SNAPSHOT'
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}